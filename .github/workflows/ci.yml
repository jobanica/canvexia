name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel older runs of the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter servd db:generate

      - name: Typecheck
        run: pnpm --filter servd typecheck

      - name: Unit tests
        # DB-backed isolation tests skip automatically without DATABASE_URL.
        run: pnpm --filter servd test

      - name: Build
        run: pnpm --filter servd build
